<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Label Generator</title>
<style>
  :root {
    --bg: #eef3f4;
    --card: #ffffff;
    --border: #d7e1e3;
    --ink: #17282b;
    --muted: #6b7b7e;
    --accent: #1e7f8c;
    --accent-dim: #cfe6e9;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  .card {
    width: 320px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 1px 2px rgba(23, 40, 43, 0.04);
    opacity: 0;
  }

  h1 {
    margin: 0 0 18px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .dropzone {
    height: 150px;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    background: #fafcfc;
  }

  .dropzone.drag {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .dropzone svg { stroke: var(--muted); }

  .dropzone img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
    opacity: 0;
  }

  input[type="file"] { display: none; }

  label.field {
    display: block;
    margin: 22px 0 8px;
    font-size: 13px;
    color: var(--muted);
  }

  select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--ink);
    background: #fafcfc;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                       linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  select:focus, .dropzone:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button.gen {
    width: 100%;
    margin-top: 26px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    position: relative;
  }

  button.gen:disabled { cursor: default; }

  .status {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    min-height: 16px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Upload</h1>

  <div class="dropzone" id="dropzone" tabindex="0">
    <svg id="placeholder-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke-width="1.6">
      <path d="M6 6l12 12M18 6L6 18"/>
    </svg>
    <img id="preview">
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <label class="field">Number of labels</label>
  <select id="labelCount">
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4" selected>4</option>
    <option value="6">6</option>
    <option value="8">8</option>
  </select>

  <button class="gen" id="genBtn">GEN</button>
  <div class="status" id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  const dropzone   = document.getElementById('dropzone');
  const fileInput  = document.getElementById('fileInput');
  const preview    = document.getElementById('preview');
  const icon       = document.getElementById('placeholder-icon');
  const genBtn     = document.getElementById('genBtn');
  const labelCount = document.getElementById('labelCount');
  const status     = document.getElementById('status');

  let selectedFile = null;

  // Card entrance
  gsap.fromTo('.card', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' });

  // Open file picker
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') fileInput.click();
  });

  // Drag styling
  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); })
  );
  dropzone.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
  fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

  function handleFile(file) {
    if (!file) return;
    selectedFile = file;
    const url = URL.createObjectURL(file);
    preview.src = url;

    gsap.to(icon, { opacity: 0, scale: 0.8, duration: 0.2 });
    gsap.fromTo(preview, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'power2.out' });
  }

  genBtn.addEventListener('click', async () => {
    if (!selectedFile) {
      gsap.fromTo(dropzone, { x: -6 }, { x: 0, duration: 0.4, ease: 'elastic.out(1, 0.3)' });
      status.textContent = 'Select an image first';
      return;
    }

    genBtn.disabled = true;
    gsap.to(genBtn, { scale: 0.97, duration: 0.1, yoyo: true, repeat: 1 });
    status.textContent = 'Generating…';

    const formData = new FormData();
    formData.append('image', selectedFile);
    formData.append('count', labelCount.value);

    try {
      const res = await fetch('/generate', { method: 'POST', body: formData });
      if (!res.ok) throw new Error(await res.text());

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `AtemoAquaLabels_${labelCount.value}each.pdf`;
      a.click();
      URL.revokeObjectURL(url);

      status.textContent = 'Done — check your downloads';
    } catch (err) {
      status.textContent = 'Something went wrong';
      console.error(err);
    } finally {
      genBtn.disabled = false;
    }
  });
</script>
</body>
</html>
